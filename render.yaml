services:
  - type: web
    name: jarvis-commerceos-staging-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free plan에서는 preDeployCommand를 사용할 수 없어 Docker 시작 직전에 마이그레이션을 수행합니다.
    dockerCommand: /bin/sh -c "python -m alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-commerceos-staging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "1440"
      - key: AI_PROVIDER
        value: deterministic
      - key: OPENAI_API_KEY
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false

  - type: web
    name: jarvis-commerceos-staging-web
    runtime: docker
    plan: free
    region: singapore
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /sourcing
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: checksPass
    envVars:
      - key: BACKEND_EXTERNAL_HOSTNAME
        fromService:
          type: web
          name: jarvis-commerceos-staging-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: NEXT_PUBLIC_API_BASE
        value: /api/backend

databases:
  - name: jarvis-commerceos-staging-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: jarvis
    user: jarvis
    ipAllowList: []
